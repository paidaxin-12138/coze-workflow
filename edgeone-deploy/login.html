<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Parfum Studio</title>
    <script>if(sessionStorage.getItem('pt'))document.documentElement.classList.add('pt')</script>
    <link rel="icon" type="image/png" href="/images/perfume-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="parfum-studio">

    <!-- ============ Navbar ============ -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500" id="navbar" style="background: rgba(250, 248, 244, 0.95); backdrop-filter: blur(12px); box-shadow: 0 1px 0 0 rgba(42, 37, 32, 0.06);">
        <nav class="max-w-7xl mx-auto px-6 md:px-10">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="font-serif text-2xl tracking-wide text-ink hover:text-forest-700 transition-colors duration-300">
                    Parfum<span class="italic font-light"> · Studio</span>
                </a>
                <div class="hidden md:flex items-center gap-10">
                    <a href="studio.html" class="text-sm tracking-widest uppercase text-ink-light hover:text-forest-700 transition-colors duration-300">工坊</a>
                    <a href="index.html#scent-families" class="text-sm tracking-widest uppercase text-ink-light hover:text-forest-700 transition-colors duration-300">香调</a>
                    <a href="tasks.html" class="text-sm tracking-widest uppercase text-ink-light hover:text-forest-700 transition-colors duration-300">任务</a>
                    <a href="history.html" class="text-sm tracking-widest uppercase text-ink-light hover:text-forest-700 transition-colors duration-300">收藏</a>
                    <a href="about.html" class="text-sm tracking-widest uppercase text-ink-light hover:text-forest-700 transition-colors duration-300">关于</a>
                    <div class="w-px h-5 bg-ink/15"></div>
                    <a href="login.html" class="text-sm tracking-widest uppercase text-forest-700 transition-colors duration-300">登录</a>
                </div>
                <a href="login.html" class="md:hidden w-8 h-8 rounded-full bg-forest-700 flex items-center justify-center" aria-label="登录账户">
                    <span class="material-symbols-outlined text-sand-50 text-[18px]">person</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- ============ 登录卡片 ============ -->
    <main class="min-h-screen pt-20 bg-sand-50 flex items-center justify-center relative overflow-hidden">
        <!-- 背景图 -->
        <div class="absolute inset-0 z-0">
            <img src="/images/luxury-bg.png" alt="" class="w-full h-full object-cover opacity-30" />
            <div class="absolute inset-0 bg-gradient-to-b from-sand-50/60 via-sand-50/80 to-sand-50"></div>
        </div>

        <!-- 登录卡 -->
        <div class="relative z-10 w-full max-w-md px-6 py-16">
            <div class="bg-sand-100/70 backdrop-blur-md border border-sand-200 p-8 md:p-12 shadow-sm">
                <!-- 标题 -->
                <div class="flex flex-col items-center mb-10 text-center">
                    <div class="w-16 h-16 mb-6 rounded-full bg-forest-700 flex items-center justify-center">
                        <span class="material-symbols-outlined text-sand-50 text-[28px]">sanitizer</span>
                    </div>
                    <h1 id="formTitle" class="heading-serif text-3xl text-ink mb-2">设计师账户登录</h1>
                    <p class="section-label">Exclusive Access</p>
                </div>

                <!-- 表单 -->
                <form id="loginForm" class="flex flex-col gap-6">
                    <!-- 设计师账号 -->
                    <div class="relative">
                        <input class="w-full bg-transparent border-b border-ink/20 px-0 py-3 text-ink text-base placeholder:text-ink-muted/40 focus:outline-none focus:border-forest-600 transition-colors duration-300" id="designerId" placeholder="设计师账号" required type="text" autocomplete="username">
                    </div>

                    <!-- 密码 -->
                    <div class="relative mt-2">
                        <input class="w-full bg-transparent border-b border-ink/20 px-0 py-3 text-ink text-base placeholder:text-ink-muted/40 focus:outline-none focus:border-forest-600 transition-colors duration-300 tracking-widest pr-10" id="password" placeholder="访问密码" required type="password" autocomplete="current-password">
                        <button class="absolute right-0 top-3 text-ink-muted hover:text-forest-700 transition-colors focus:outline-none" id="togglePw" type="button" aria-label="切换密码可见性">
                            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
                        </button>
                    </div>

                    <!-- 错误提示 -->
                    <div id="errorMsg" class="hidden text-clay-600 text-xs tracking-wide flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">error</span>
                        <span id="errorMsgText">账号或密码错误，请重试</span>
                    </div>

                    <!-- 提交按钮 -->
                    <div class="mt-4 flex flex-col gap-5">
                        <button class="btn-primary w-full justify-center" type="submit">
                            <span class="relative z-10 flex items-center justify-center gap-2 btn-text">登录 <span class="material-symbols-outlined text-[16px]">arrow_forward</span></span>
                            <!-- 加载状态 -->
                            <div id="loadingOverlay" class="absolute inset-0 bg-forest-800 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                                <svg class="animate-spin h-5 w-5 text-sand-50" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                                </svg>
                            </div>
                        </button>

                        <div class="flex justify-center items-center text-xs text-ink-muted">
                            <a id="toggleMode" href="#" class="hover:text-forest-700 transition-colors duration-300">还没有账号？<span class="text-forest-700 cursor-pointer hover:underline">立即注册</span></a>
                        </div>
                    </div>
                </form>

                <!-- 装饰性边角 -->
                <div class="absolute top-0 left-0 w-6 h-6 border-t border-l border-forest-700/40 opacity-50 pointer-events-none"></div>
                <div class="absolute bottom-0 right-0 w-6 h-6 border-b border-r border-forest-700/40 opacity-50 pointer-events-none"></div>
            </div>

            <!-- 页脚装饰 -->
            <div class="mt-10 flex items-center justify-center gap-4 text-ink-muted/40 pointer-events-none">
                <span class="w-10 h-px bg-ink-muted/30"></span>
                <span class="font-serif tracking-[0.3em] text-[10px] italic">Parfum · Studio // 2026</span>
                <span class="w-10 h-px bg-ink-muted/30"></span>
            </div>
        </div>
    </main>

    <!-- ============ 登录失败弹窗 ============ -->
    <div id="errorModal" class="hidden fixed inset-0 z-[100] items-center justify-center p-6" style="background: rgba(42, 37, 32, 0.5); backdrop-filter: blur(4px);">
        <div class="bg-sand-50 border border-sand-200 shadow-xl w-full max-w-sm p-8 text-center relative" role="alertdialog" aria-modal="true" aria-labelledby="errorModalTitle">
            <!-- 装饰性边角 -->
            <div class="absolute top-0 left-0 w-5 h-5 border-t border-l border-clay-600/40 pointer-events-none"></div>
            <div class="absolute bottom-0 right-0 w-5 h-5 border-b border-r border-clay-600/40 pointer-events-none"></div>

            <div class="w-14 h-14 mx-auto mb-5 rounded-full bg-clay-600/10 flex items-center justify-center">
                <span class="material-symbols-outlined text-clay-600 text-[28px]">error</span>
            </div>
            <h3 id="errorModalTitle" class="heading-serif text-2xl text-ink mb-2">登录失败</h3>
            <p id="errorModalMsg" class="text-sm text-ink-muted leading-relaxed mb-8">账号或密码错误，请重试</p>

            <div class="flex flex-col gap-3">
                <button id="errorModalOk" class="btn-primary w-full justify-center" type="button">知道了</button>
                <button id="errorModalRegister" class="hidden w-full justify-center text-xs tracking-widest uppercase text-forest-700 hover:underline transition-colors py-2" type="button">没有账号？立即注册</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const STORAGE_KEY = 'pcs_user_session';
        const API_BASE = (typeof window !== 'undefined' && window.__API_BASE__) || '';
        const form = document.getElementById('loginForm');
        const togglePw = document.getElementById('togglePw');
        const passwordInput = document.getElementById('password');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('errorMsg');
        const errorMsgText = document.getElementById('errorMsgText');
        let mode = 'login';  // login | register

        // 已登录则直接跳转首页（token 校验由后端完成）
        try {
            const session = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (session && session.token) {
                window.location.href = 'index.html';
                return;
            }
        } catch (_) {}

        // 切换密码可见性
        if (togglePw) {
            togglePw.addEventListener('click', () => {
                const isPw = passwordInput.type === 'password';
                passwordInput.type = isPw ? 'text' : 'password';
                togglePw.querySelector('span').textContent = isPw ? 'visibility' : 'visibility_off';
            });
        }

        function showError(msg) {
            errorMsgText.textContent = msg || '账号或密码错误，请重试';
            errorMsg.classList.remove('hidden');
            errorMsg.classList.add('flex');
        }
        function hideError() {
            errorMsg.classList.add('hidden');
            errorMsg.classList.remove('flex');
        }

        // ============ 登录失败弹窗 ============
        const errorModal = document.getElementById('errorModal');
        const errorModalTitle = document.getElementById('errorModalTitle');
        const errorModalMsg = document.getElementById('errorModalMsg');
        const errorModalOk = document.getElementById('errorModalOk');
        const errorModalRegister = document.getElementById('errorModalRegister');

        // 根据状态码/错误码映射弹窗标题与描述
        function resolveError(res, data, isRegister) {
            const code = data && data.code;
            const serverMsg = (data && (data.error || data.message)) || '';
            if (res.status === 404 || code === 'USER_NOT_FOUND') {
                return { title: '账号不存在', msg: serverMsg || '该账号尚未注册，请先创建账户', showRegister: !isRegister };
            }
            if (res.status === 401 || code === 'WRONG_PASSWORD') {
                return { title: '密码错误', msg: serverMsg || '您输入的密码不正确，请重试', showRegister: false };
            }
            if (res.status === 403 || code === 'ACCOUNT_DISABLED') {
                return { title: '账号已被禁用', msg: serverMsg || '该账号已被禁用，请联系管理员', showRegister: false };
            }
            if (res.status === 409) {
                return { title: '账号已被注册', msg: serverMsg || '该设计师账号已存在，请直接登录或更换账号名', showRegister: false };
            }
            if (res.status === 400) {
                return { title: isRegister ? '注册信息有误' : '登录信息有误', msg: serverMsg || '请检查填写的内容后重试', showRegister: false };
            }
            return { title: isRegister ? '注册失败' : '登录失败', msg: serverMsg || '服务暂时不可用，请稍后重试', showRegister: false };
        }

        function showErrorModal({ title, msg, showRegister }) {
            if (errorModalTitle) errorModalTitle.textContent = title;
            if (errorModalMsg) errorModalMsg.textContent = msg;
            if (errorModalRegister) errorModalRegister.classList.toggle('hidden', !showRegister);
            errorModal.classList.remove('hidden');
            errorModal.classList.add('flex');
        }
        function hideErrorModal() {
            errorModal.classList.add('hidden');
            errorModal.classList.remove('flex');
        }
        if (errorModalOk) errorModalOk.addEventListener('click', hideErrorModal);
        // 点击遮罩关闭
        errorModal.addEventListener('click', (e) => { if (e.target === errorModal) hideErrorModal(); });
        // ESC 关闭
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideErrorModal(); });
        // "立即注册"：关闭弹窗并切换到注册模式（保留已填账号）
        if (errorModalRegister) {
            errorModalRegister.addEventListener('click', () => {
                hideErrorModal();
                if (mode !== 'register') {
                    mode = 'register';
                    updateMode();
                    hideError();
                }
                document.getElementById('designerId').focus();
            });
        }
        function setLoading(on) {
            loadingOverlay.style.opacity = on ? '1' : '0';
            loadingOverlay.style.pointerEvents = on ? 'auto' : 'none';
            const submitBtn = form.querySelector('button[type=submit]');
            if (submitBtn) submitBtn.disabled = on;
        }

        // 切换登录/注册模式
        const toggleModeLink = document.getElementById('toggleMode');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = form.querySelector('button[type=submit]');
        function updateMode() {
            if (mode === 'register') {
                if (formTitle) formTitle.textContent = '创建新账户';
                if (submitBtn) {
                    if (submitBtn.querySelector('.btn-text')) submitBtn.querySelector('.btn-text').innerHTML = '注册并登录 <span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
                }
                if (toggleModeLink) toggleModeLink.innerHTML = '已有账号？<span class="text-forest-700 cursor-pointer hover:underline">直接登录</span>';
            } else {
                if (formTitle) formTitle.textContent = '设计师账户登录';
                if (submitBtn) {
                    if (submitBtn.querySelector('.btn-text')) submitBtn.querySelector('.btn-text').innerHTML = '登录 <span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
                }
                if (toggleModeLink) toggleModeLink.innerHTML = '还没有账号？<span class="text-forest-700 cursor-pointer hover:underline">立即注册</span>';
            }
        }
        if (toggleModeLink) {
            toggleModeLink.addEventListener('click', (e) => {
                e.preventDefault();
                mode = (mode === 'login') ? 'register' : 'login';
                updateMode();
                hideError();
            });
            updateMode();
        }

        // 表单提交：调用真实后端 API
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const designerId = document.getElementById('designerId').value.trim();
            const password = passwordInput.value;

            if (!designerId || !password) {
                showError('请填写完整账号与密码');
                return;
            }
            if (password.length < 6) {
                showError(mode === 'register' ? '密码至少 6 位' : '密码至少 6 位');
                return;
            }

            setLoading(true);
            try {
                const endpoint = mode === 'register' ? '/api/register' : '/api/login';
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ designer_id: designerId, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    // 表单内小字提示 + 居中弹窗，错误字段优先读 error（后端契约）
                    const info = resolveError(res, data, mode === 'register');
                    showError(info.msg);
                    showErrorModal(info);
                    return;
                }
                // 保存 session 到 localStorage
                const session = {
                    token: data.token,
                    expires_at: data.expires_at,
                    user: data.user
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
                // 跳回首页
                window.location.href = 'index.html';
            } catch (err) {
                console.error('登录请求失败:', err);
                showError('网络错误，请检查服务器是否运行');
                showErrorModal({ title: '网络错误', msg: `无法连接服务器，请确认服务已启动（http://localhost:${window.location.port || 3000}）`, showRegister: false });
            } finally {
                setLoading(false);
            }
        });
    })();
    </script>
    <script src="/page-transition.js"></script>
    <div class="page-transition-overlay"><div class="pt-skeleton"><div class="skeleton-header"></div><div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-image"></div></div><div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-image"></div></div><div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-image"></div></div></div></div>
</body>
</html>
