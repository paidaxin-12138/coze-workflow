<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 · Parfum Studio</title>
    <link rel="icon" type="image/png" href="/images/perfume-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="parfum-studio min-h-screen flex items-center justify-center bg-sand-50">
    <div class="text-center px-6 max-w-lg">
        <div class="text-8xl font-serif text-ink/10 mb-6">500</div>
        <h1 class="heading-serif text-3xl md:text-4xl mb-4 text-ink">服务器遇到了一点小问题</h1>
        <p class="text-ink-light text-lg font-light leading-relaxed mb-8">
            我们的香氛工坊正在努力修复中，请稍后再试。
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="btn-primary inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl">
                <span class="material-symbols-outlined text-lg">home</span>
                返回首页
            </a>
            <button onclick="location.reload()" class="btn-secondary inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl border border-ink/10">
                <span class="material-symbols-outlined text-lg">refresh</span>
                重新加载
            </button>
        </div>
    </div>
</body>
</html>
