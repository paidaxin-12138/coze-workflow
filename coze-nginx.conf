# Nginx 配置 — 静态资源加速 + API 反向代理 + SSE 支持 + HTTPS
# 部署位置：/etc/nginx/conf.d/coze.conf
# 上传后：nginx -t && systemctl reload nginx

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;  # 替换为你的域名或 IP
    return 301 https://$host$request_uri;
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name _;  # 替换为你的域名或 IP

    # SSL 证书配置（替换为实际证书路径）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # ← 替换为实际证书路径
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;     # ← 替换为实际密钥路径
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 拒绝访问 .db 文件
    location ~ \.db$ {
        deny all;
    }

    # 拒绝访问敏感文件
    location ~ \.(env|git|log|json|lock)$ {
        deny all;
    }

    # 静态文件 — 由 Nginx 直接返回，不经过 Node.js
    # 前端静态资源存放在 frontend/ 目录（即项目的 frontend/ 目录）
    # 部署前请将 frontend/ 目录复制到服务器对应路径
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
        root /var/www/parfum-studio/frontend;   # ← 部署时改为实际路径
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # HTML 页面 — 较短缓存（便于更新）
    location ~* \.html$ {
        root /var/www/parfum-studio/frontend;   # ← 部署时改为实际路径
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # API 请求 — 转发到 Node.js 3000 端口
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持：关闭代理缓冲，让流式数据实时到达前端
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 长连接超时（24小时）
        proxy_send_timeout 86400s;
    }

    # 其他所有请求 — 转发到 Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}