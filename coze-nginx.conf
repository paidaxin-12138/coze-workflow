# Nginx 配置 — 静态资源加速 + API 反向代理 + SSE 支持
# 部署位置：/etc/nginx/conf.d/coze.conf
# 上传后：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # 替换为你的域名或 IP

    # 静态文件 — 由 Nginx 直接返回，不经过 Node.js
    # 前端静态资源存放在 frontend/ 目录（即项目的 frontend/ 目录）
    # 部署前请将 frontend/ 目录复制到服务器对应路径
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
        root /var/www/parfum-studio/frontend;   # ← 部署时改为实际路径
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # HTML 页面 — 较短缓存（便于更新）
    location ~* \.html$ {
        root /var/www/parfum-studio/frontend;   # ← 部署时改为实际路径
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # API 请求 — 转发到 Node.js 3000 端口
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持：关闭代理缓冲，让流式数据实时到达前端
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 长连接超时（24小时）
        proxy_send_timeout 86400s;
    }

    # 其他所有请求 — 转发到 Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}